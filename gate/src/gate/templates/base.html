<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ArgenSec Gate{% endblock %}</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f6f8;--card:#fff;--pub:#047857;--pub-bg:#ecfdf5;--wait:#b45309;--wait-bg:#fffbeb;--blk:#b91c1c;--blk-bg:#fef2f2;--accent:#1d4ed8;--top:#111827;--r:12px}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--top);color:#fff;padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header.public{background:#0b4f8a}header a{color:#d1d5db;text-decoration:none}header a:hover{color:#fff}
header .brand{font-weight:700;color:#fff;margin-right:auto}
main{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.b-public,.b-approved{background:var(--pub-bg);color:var(--pub)}.b-hold{background:var(--wait-bg);color:var(--wait)}.b-withheld{background:var(--blk-bg);color:var(--blk)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 16px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn-ghost{background:#e5e7eb;color:var(--ink)}.btn-green{background:var(--pub)}.btn-red{background:var(--blk)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:100%}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat{font-size:28px;font-weight:700}
footer{max-width:1180px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--muted)}
</style></head><body>
{% block header %}
<header><a class="brand" href="/">ArgenSec Gate</a><a href="/">Live</a><a href="/public">Public site ↗</a><a href="/dashboard">Log</a></header>
{% endblock %}
<main>{% block body %}{% endblock %}</main>
<footer>{% block footer %}Demo data. People and records are fictional.{% endblock %}</footer>
</body></html>
