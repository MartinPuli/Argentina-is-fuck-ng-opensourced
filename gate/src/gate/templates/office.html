{% extends "base.html" %}{% block body %}
<h1>New abbreviated purchase</h1><p class="muted">Upload the purchase and every attachment. The gate decides what can be published.</p>
<form class="card" method="post" action="/office" enctype="multipart/form-data">
<label>Office</label><select name="office">{% for o in offices %}<option>{{ o }}</option>{% endfor %}</select>
<label>Procedure</label><input name="procedure" value="Compulsa abreviada 1100/2026">
<label>Item</label><input name="item" placeholder="Silla de ruedas motorizada">
<label>Amount (ARS)</label><input name="amount" type="number" value="1000000">
<label>Attachments (PDF)</label><input name="files" type="file" accept="application/pdf" multiple>
<p><button>Submit to the gate</button></p></form>
<form method="post" action="/demo/seed"><button class="btn-ghost">Or load the fictional PAMI case</button></form>
{% endblock %}
