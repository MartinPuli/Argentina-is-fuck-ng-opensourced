[project]
name = "gate"
version = "0.1.0"
description = "Publication gate: stops private attachments from reaching a public procurement portal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25",
    "pytesseract>=0.3.13",
    "pillow>=11",
    "openai>=1.60",
    "clickhouse-connect>=0.8",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gate"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
